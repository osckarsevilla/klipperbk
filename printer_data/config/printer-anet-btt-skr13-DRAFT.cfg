# ============================================================================
# Klipper printer.cfg -- BORRADOR para Anet con placa BigTreeTech SKR V1.3
# ============================================================================
# Generado a partir de:
#  - M115/M503 leidos EN VIVO del firmware Marlin 2.0.7.2 que corre ahora
#    mismo en la placa (28/08/2026), via la conexion serie de OctoPrint
#  - Mapeo de pines oficial de Klipper para SKR v1.3
#    (~/klipper/config/generic-bigtreetech-skr-v1.3.cfg), placa confirmada
#    por foto: "BIGTREETECH SKR V1.3", MCU "NXP LPC1768FBD100"
#  - Perfil "Anet" guardado en OctoPrint (tamano de cama: 210x210, altura 220)
#  - Foto de los conectores de endstop: X- e Y- tienen el conector enchufado
#    -> homing hacia el origen (0,0), como es habitual
#  - Confirmado por ti: SIN sonda de nivelado (BLTouch/inductiva)
#
# IMPORTANTE -- esto NO se puede usar todavia:
#  Para usar Klipper hay que reflashear la placa con firmware Klipper
#  (make menuconfig -> Micro-controller Architecture: LPC176x,
#   Bootloader offset: 16KiB al usar la SD, o el que corresponda).
#  Marlin y Klipper no pueden convivir en el mismo flash: al reflashear,
#  este firmware Marlin actual (2.0.7.2) se pierde.
#
# PENDIENTE DE VERIFICAR ANTES DE IMPRIMIR EN SERIO:
#  1) [mcu] serial: -- placeholder, hay que rellenarlo DESPUES de flashear
#     Klipper (con "ls /dev/serial/by-id/" saldra algo tipo
#     "usb-Klipper_lpc1768_XXXXXXXX-if00")
#  2) Modo UART vs standalone de los drivers TMC2208: no se pudo confirmar
#     al 100% por foto si los jumpers XUART/YUART/ZUART/E0UART estan puestos.
#     Este archivo asume UART (lo mas comun en estos kits). Si Klipper falla
#     al arrancar con un error de comunicacion UART, comenta las 4 secciones
#     [tmc2208 ...] de abajo -- los motores seguiran funcionando igual, solo
#     que sin stealthChop ni control de corriente por software (la corriente
#     la fija entonces el potenciometro fisico de cada modulo).
#  3) Endstop de Z: se asume Z-min (P1.25), no se pudo confirmar por foto.
#     Verificar que el microswitch de Z esta cableado a ese conector.
#  4) PID: los valores de abajo vienen de M301/M304 de Marlin y son solo un
#     punto de partida -- Marlin y Klipper NO calculan el PID igual.
#     Ejecutar PID_CALIBRATE (extrusor y cama) despues del primer flasheo.
#  5) rotation_distance: calculado asumiendo 16 micropasos, que es lo que
#     encaja con los steps/mm redondos que reporta Marlin (80.20 ~ 80).
#     Verificar imprimiendo un cubo de calibracion.
#  6) Tipo real de termistor (hotend/cama): puesto el valor mas comun para
#     este tipo de placa/kit, verificar contra la etiqueta del termistor.
#  7) Ventilador de la boquilla (hotend_fan): no se ha podido identificar el
#     pin en las fotos, falta anadir esa seccion.
# ============================================================================

[mcu]
# TODO: rellenar tras flashear Klipper (ls /dev/serial/by-id/)
serial: /dev/serial/by-id/usb-Klipper_lpc1768_XXXXXXXX-if00
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 2000
max_z_velocity: 50
max_z_accel: 100
square_corner_velocity: 5.0

[stepper_x]
step_pin: P2.2
dir_pin: !P2.6
enable_pin: !P2.1
microsteps: 16
rotation_distance: 39.900   # = 200 * 16 / 80.20 (steps/mm real de M503)
endstop_pin: P1.29          # X-min -- confirmado enchufado en foto
position_endstop: 0
position_min: 0
position_max: 210           # perfil "Anet" en OctoPrint
homing_speed: 50

[stepper_y]
step_pin: P0.19
dir_pin: !P0.20
enable_pin: !P2.8
microsteps: 16
rotation_distance: 39.900   # = 200 * 16 / 80.20
endstop_pin: P1.27          # Y-min -- confirmado enchufado en foto
position_endstop: 0
position_min: 0
position_max: 210           # perfil "Anet" en OctoPrint
homing_speed: 50

[stepper_z]
step_pin: P0.22
dir_pin: P2.11
enable_pin: !P0.21
microsteps: 16
rotation_distance: 7.982    # = 200 * 16 / 400.90
endstop_pin: P1.25          # Z-min -- SIN CONFIRMAR (ver nota 3 arriba)
position_endstop: 0
position_max: 220           # perfil "Anet" en OctoPrint
homing_speed: 8

[extruder]
step_pin: P2.13
dir_pin: !P0.11
enable_pin: !P2.12
microsteps: 16
rotation_distance: 34.520   # = 200 * 16 / 92.70 (steps/mm real de M503)
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: P2.7
sensor_type: EPCOS 100K B57560G104F   # verificar termistor real (nota 6)
sensor_pin: P0.24
control: pid
# Punto de partida desde M301 de Marlin -- ejecutar PID_CALIBRATE (nota 4)
pid_Kp: 23.01
pid_Ki: 1.62
pid_Kd: 81.86
min_temp: 0
max_temp: 260
max_extrude_only_distance: 100

[heater_bed]
heater_pin: P2.5
sensor_type: ATC Semitec 104GT-2      # verificar termistor real (nota 6)
sensor_pin: P0.23
control: pid
# Punto de partida desde M304 de Marlin -- ejecutar PID_CALIBRATE (nota 4)
pid_Kp: 78.69
pid_Ki: 15.72
pid_Kd: 262.55
min_temp: 0
max_temp: 125

[fan]
pin: P2.3

########################################
# Drivers TMC2208 -- modo UART (supuesto, ver nota 2 arriba)
########################################

[tmc2208 stepper_x]
uart_pin: P1.17
run_current: 0.800
stealthchop_threshold: 999999

[tmc2208 stepper_y]
uart_pin: P1.15
run_current: 0.800
stealthchop_threshold: 999999

[tmc2208 stepper_z]
uart_pin: P1.10
run_current: 0.600
stealthchop_threshold: 999999

[tmc2208 extruder]
uart_pin: P1.8
run_current: 0.700
stealthchop_threshold: 999999

########################################
# Pines EXP1/EXP2 (pantalla), por si hay una LCD conectada
########################################

[board_pins]
aliases:
    EXP1_1=P1.30, EXP1_3=P1.18, EXP1_5=P1.20, EXP1_7=P1.22, EXP1_9=<GND>,
    EXP1_2=P0.28, EXP1_4=P1.19, EXP1_6=P1.21, EXP1_8=P1.23, EXP1_10=<5V>,
    EXP2_1=P0.17, EXP2_3=P3.26, EXP2_5=P3.25, EXP2_7=P1.31, EXP2_9=<GND>,
    EXP2_2=P0.15, EXP2_4=P0.16, EXP2_6=P0.18, EXP2_8=<RST>, EXP2_10=<NC>

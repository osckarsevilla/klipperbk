# Config raspberry





[safe_z_home]
home_xy_position: 161, 126
speed: 100
z_hop: 10
z_hop_speed: 20

# =========================================================
# BED MESH
# =========================================================

[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 44, 30
mesh_max: 190, 200
probe_count: 5, 5
mesh_pps: 2, 2
algorithm: bicubic
fade_start: 1
fade_end: 10
fade_end: 10

# =========================================================
# SCREW TILT (nivelación manual asistida)
# =========================================================
[screws_tilt_adjust]
screw1: 74, 42
screw1_name: delantero izquierdo
screw2: 184, 42
screw2_name: delantero derecho
screw3: 184, 197
screw3_name: trasero derecho
screw4: 74, 197
screw4_name: trasero izquierdo
horizontal_move_z: 10
speed: 50
screw_thread: CW-M4





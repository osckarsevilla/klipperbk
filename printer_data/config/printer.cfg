





##### Includes


[virtual_sdcard]
path: /home/oscar/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[pause_resume]

[display_status]


[include macros/*.cfg]
[exclude_object]
[include KAMP_Settings.cfg]

# =========================================================
# Ender 3 | SKR V1.4 Turbo | TMC2208 UART | BMG Direct Drive | BLTouch | Klipper
# =========================================================

[mcu]
serial: /dev/serial/by-id/usb-Klipper_lpc1769_0220001125813AAFFCCC6B5CC12000F5-if00
# Para encontrar tu ID: ls /dev/serial/by-id/

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100
square_corner_velocity: 5.0

# =========================================================
# STEPPERS
# =========================================================

[stepper_x]
step_pin: P2.2
dir_pin: !P2.6
enable_pin: !P2.1
microsteps: 16
rotation_distance: 40
endstop_pin: !P1.29
position_endstop: 0
position_min: 0
position_max: 235
homing_speed: 50

[stepper_y]
step_pin: P0.19
dir_pin: !P0.20
enable_pin: !P2.8
microsteps: 16
rotation_distance: 40
endstop_pin: !P1.27
position_endstop: 0
position_min: 0
position_max: 235
homing_speed: 50


[stepper_z]
step_pin: P0.22
dir_pin: P2.11
enable_pin: !P0.21
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -3
position_max: 250
homing_speed: 10
second_homing_speed: 3
homing_retract_dist: 5


[stepper_z1]
step_pin: P1.15
dir_pin: P1.14
enable_pin: !P1.16
microsteps: 16
rotation_distance: 8



# =========================================================
# EXTRUSOR - BMG Direct Drive
# =========================================================

[extruder]
step_pin: P2.13
dir_pin: P0.11
enable_pin: !P2.12
microsteps: 16
rotation_distance: 7.710       # BMG confirmado
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_distance: 100  # Directo: mucho menos que Bowden
max_extrude_cross_section: 5
pressure_advance: 0.0           # Calibrar con Ellis3dp tras primeras pruebas
pressure_advance_smooth_time: 0.040
heater_pin: P2.7
sensor_type: EPCOS 100K B57560G104F
sensor_pin: P0.24
min_temp: 0
max_temp: 270
min_extrude_temp: 170
# PID a calibrar: PID_CALIBRATE HEATER=extruder TARGET=200
control: pid
pid_kp: 21.527
pid_ki: 1.063
pid_kd: 108.982

# =========================================================
# CAMA
# =========================================================

[heater_bed]
heater_pin: P2.5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: P0.25
min_temp: 0
max_temp: 130
# PID a calibrar: PID_CALIBRATE HEATER=heater_bed TARGET=60
control: pid
pid_kp: 54.027
pid_ki: 0.770
pid_kd: 948.182

# =========================================================
# VENTILADORES
# =========================================================

[fan]           # Ventilador de capa (PWM)
pin: P2.3

[heater_fan hotend_fan]
pin: P2.4
heater: extruder
heater_temp: 50.0

# =========================================================
# BLTOUCH
# =========================================================

[bltouch]
sensor_pin: ^P0.10
control_pin: P2.0
x_offset: -44      # Ajusta según tu montaje
y_offset: -9       # Ajusta según tu montaje
z_offset: 0        # Se calibra con PROBE_CALIBRATE
speed: 3.0
lift_speed: 5.0
samples: 2
sample_retract_dist: 3.0
samples_tolerance: 0.010
samples_tolerance_retries: 3

[safe_z_home]
home_xy_position: 161.5, 126.5  # Centro teniendo en cuenta offset BLTouch
speed: 50
z_hop: 10
z_hop_speed: 5

# =========================================================
# BED MESH
# =========================================================

[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 44, 9         # Tiene en cuenta el offset del BLTouch
mesh_max: 235, 226
probe_count: 5, 5
mesh_pps: 2, 2
algorithm: bicubic
fade_start: 1
fade_end: 10

# =========================================================
# SCREW TILT (nivelación manual asistida)
# =========================================================

[screws_tilt_adjust]
screw1: 74, 42
screw1_name: delantero izquierdo
screw2: 235, 42
screw2_name: delantero derecho
screw3: 235, 212
screw3_name: trasero derecho
screw4: 74, 212
screw4_name: trasero izquierdo
horizontal_move_z: 10
speed: 50
screw_thread: CW-M4





# =========================================================
# TMC2208 UART - SKR V1.4 Turbo
# =========================================================

[tmc2208 stepper_x]
uart_pin: P1.10
run_current: 0.650
stealthchop_threshold: 999999

[tmc2208 stepper_y]
uart_pin: P1.9
run_current: 0.650
stealthchop_threshold: 999999

[tmc2208 stepper_z]
uart_pin: P1.8
run_current: 0.800
stealthchop_threshold: 999999

[tmc2208 extruder]
uart_pin: P1.4
run_current: 0.650
stealthchop_threshold: 999999

# [board_pins]
# aliases:
#     EXP1_1=P1.30, EXP1_2=P0.28, EXP1_3=P1.18, EXP1_4=P1.19,
#     EXP1_5=P0.01, EXP1_6=P0.00, EXP1_7=P1.20, EXP1_8=P1.21,
#     EXP1_9=<GND>, EXP1_10=<5V>,
#     EXP2_1=P0.17, EXP2_2=P0.15, EXP2_3=P2.10, EXP2_4=P0.16,
#     EXP2_5=P0.18, EXP2_6=P0.08, EXP2_7=P1.23, EXP2_8=<RST>,
#     EXP2_9=<GND>, EXP2_10=<5V>




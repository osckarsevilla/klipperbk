# =========================================================
# Ender 3 | Creality 4.2.7 | Extrusor BMG | Sensor 3D Touch (clon BLTouch)
# =========================================================

[mcu]
serial = /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
restart_method = command

[force_move]
enable_force_move = True

[printer]
kinematics = cartesian
max_velocity = 300
max_accel = 2000
max_z_velocity = 10
max_z_accel = 100
square_corner_velocity = 5.0

[input_shaper]
shaper_freq_x = 38.0
shaper_freq_y = 32.0
shaper_type = mzv

[stepper_x]
step_pin = PB9
dir_pin = PC2
enable_pin = !PC3
microsteps = 16
rotation_distance = 40
endstop_pin = ^PA5
position_endstop = 0
position_max = 235
homing_speed = 30
homing_retract_dist = 5

[stepper_y]
step_pin = PB7
dir_pin = PB8
enable_pin = !PC3
microsteps = 16
rotation_distance = 40
endstop_pin = ^PA6
position_endstop = 0
position_min = 0
position_max = 230
homing_speed = 60
homing_retract_dist = 5

[stepper_z]
step_pin = PB5
dir_pin = !PB6
enable_pin = !PC3
microsteps = 16
rotation_distance = 8
endstop_pin = probe:z_virtual_endstop
position_min = -5
position_max = 180

# =========================================================
# EXTRUSOR - BMG Direct Drive
# =========================================================
[extruder]
step_pin = PB3
dir_pin = PB4
enable_pin = !PC3
microsteps = 16
rotation_distance = 22.225
nozzle_diameter = 0.400
filament_diameter = 1.750
heater_pin = PA1
sensor_type = EPCOS 100K B57560G104F
sensor_pin = PC5
#control = watermark
min_temp = 0
max_temp = 250
min_extrude_temp = 170
pressure_advance = 0.05
max_extrude_only_distance = 200.0
max_extrude_cross_section = 5
max_extrude_only_velocity = 50

[firmware_retraction]
retract_length = 0.8
retract_speed = 25
unretract_extra_length = 0
unretract_speed = 25

# =========================================================
# CAMA
# =========================================================
[heater_bed]
heater_pin = PA2
sensor_type = EPCOS 100K B57560G104F
sensor_pin = PC4
#control = watermark
min_temp = 0
max_temp = 130
# Calibrar con: PID_CALIBRATE HEATER=heater_bed TARGET=60 (esto añadirá control=pid automáticamente)

# =========================================================
# VENTILADORES
# =========================================================
[fan]
pin = PA0

[heater_fan hotend_fan]
pin = PC0
heater = extruder
heater_temp = 50.0

# =========================================================
# SENSOR 3D TOUCH (clon compatible BLTouch)
# =========================================================
[bltouch]
sensor_pin = ^PB1
control_pin = PB0
pin_up_touch_mode_reports_triggered = False
probe_with_touch_mode = False
pin_up_reports_not_triggered = True
stow_on_each_sample = True
x_offset = -44.0
y_offset = -6.0
speed = 3
lift_speed = 10
samples = 3
sample_retract_dist = 5.0
samples_tolerance = 0.100
samples_tolerance_retries = 3
pin_move_time = 0.4
#z_offset = 4.787
# Valor heredado de la calibración anterior en esta misma placa; verifica con PROBE_CALIBRATE

[safe_z_home]
home_xy_position = 117, 117
speed = 80
z_hop = 10
z_hop_speed = 10

[bed_mesh]
speed = 80
horizontal_move_z = 10
mesh_min = 15, 15
mesh_max = 190, 200
probe_count = 5, 5
algorithm = bicubic
fade_start = 1
fade_end = 10
fade_target = 0
adaptive_margin = 5

[screws_tilt_adjust]
screw1 = 70, 41
screw1_name = Frontal izquierda
screw2 = 189, 45
screw2_name = Frontal derecha
screw3 = 189, 208
screw3_name = Trasera derecha
screw4 = 70, 208
screw4_name = Trasera izquierda
horizontal_move_z = 10
speed = 40
screw_thread = CW-M4

# =========================================================
# SENSOR DE FILAMENTO
# =========================================================
[filament_switch_sensor sensor_filamento]
pause_on_runout = True
runout_gcode:
    PAUSE
    M117 Sin filamento!
insert_gcode:
    M117 Filamento detectado
event_delay = 3.0
switch_pin = ^!PA4

# =========================================================
# DISPLAY (Ender 3 stock)
# =========================================================
[display]
lcd_type = st7920
cs_pin = PB12
sclk_pin = PB13
sid_pin = PB15
encoder_pins = ^PB14, ^PB10
click_pin = ^!PB2

# =========================================================
# TEMPERATURAS HOST Y MCU
# =========================================================
[temperature_sensor host]
sensor_type = temperature_host
min_temp = 0
max_temp = 100

[temperature_sensor mcu_creality]
sensor_type = temperature_mcu
sensor_mcu = mcu
min_temp = 0
max_temp = 100

# =========================================================
# INCLUDES Y EXTRAS DE MOONRAKER/MAINSAIL
# =========================================================
[include macros/*.cfg]

[virtual_sdcard]
path = /home/oscar/printer_data/gcodes
on_error_gcode = CANCEL_PRINT

[pause_resume]
[display_status]
[respond]
[exclude_object]








##### Includes


[virtual_sdcard]
path: /home/oscar/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[pause_resume]

[display_status]


[respond]


[include macros/*.cfg]
[exclude_object]
[include KAMP_Settings.cfg]

# =========================================================
# Ender 3 | SKR V1.4 Turbo | TMC2208 UART | BMG Direct Drive | BLTouch | Klipper
# =========================================================

[mcu]
serial: /dev/serial/by-id/usb-Klipper_lpc1769_0220001125813AAFFCCC6B5CC12000F5-if00
# Para encontrar tu ID: ls /dev/serial/by-id/

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 10
max_z_accel: 100
square_corner_velocity: 5.0

# =========================================================
# STEPPERS
# =========================================================

[stepper_x]
step_pin: P2.2
dir_pin: !P2.6
enable_pin: !P2.1
microsteps: 16
rotation_distance: 40
endstop_pin: !P1.29
position_endstop: 0
position_min: 0
position_max: 228
homing_speed: 50


#### Gemini



[stepper_y]
step_pin: P0.19
dir_pin: P0.20              # Sin ! — home va hacia Y positivo (atrás)
enable_pin: !P2.8
microsteps: 16
rotation_distance: 40
endstop_pin: ^!P1.28        # ^ pull-up interno imprescindible
position_endstop: 220
position_min: -15
position_max: 220
homing_speed: 10
homing_retract_dist: 5
homing_positive_dir: true




# [stepper_y]
# step_pin: P0.19
# dir_pin: !P0.20
# enable_pin: !P2.8
# microsteps: 16
# rotation_distance: 40
# endstop_pin: !P1.28
# position_endstop: 0
# position_min: 0
# position_max: 235
# homing_speed: 50


[stepper_z]
step_pin: P0.22
dir_pin: P2.11
enable_pin: !P0.21
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -3
position_max: 250
homing_speed: 5
second_homing_speed: 2
homing_retract_dist: 8
homing_retract_speed: 10






[stepper_z1]
step_pin: P1.15
dir_pin: P1.14
enable_pin: !P1.16
microsteps: 16
rotation_distance: 8


[z_tilt]
z_positions:
    -35, 117
    270, 117
points:
    60, 117
    184, 117
speed: 100
horizontal_move_z: 10
retries: 10
retry_tolerance: 0.025

# =========================================================
# EXTRUSOR - BMG Direct Drive
# =========================================================

[extruder]
step_pin: P2.13
dir_pin: P0.11
enable_pin: !P2.12
microsteps: 16
rotation_distance: 7.710       # BMG confirmado
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_distance: 100  # Directo: mucho menos que Bowden
max_extrude_cross_section: 5
pressure_advance: 0.0           # Recalibrar tras pasar a directo (antes bowden ~0.25)
pressure_advance_smooth_time: 0.040
heater_pin: P2.7
sensor_type: EPCOS 100K B57560G104F
sensor_pin: P0.24
min_temp: 0
max_temp: 270
min_extrude_temp: 170
#control: pid
#pid_kp: 29.581
#pid_ki: 2.348
#pid_kd: 93.179







[verify_heater extruder]
max_error: 120       # por defecto 120, puedes subir a 150-200
check_gain_time: 60  # segundos para alcanzar temperatura (default: 20)
hysteresis: 5
heating_gain: 1

# =========================================================
# CAMA
# =========================================================

[heater_bed]
heater_pin: P2.5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: P0.25
min_temp: 0
max_temp: 130
# PID a calibrar: PID_CALIBRATE HEATER=heater_bed TARGET=60
control: pid
pid_kp: 54.027
pid_ki: 0.770
pid_kd: 948.182

# =========================================================
# VENTILADORES
# =========================================================

[fan]           # Ventilador de capa (PWM)
pin: P2.3

[heater_fan hotend_fan]
pin: P2.4
heater: extruder
heater_temp: 50.0

# =========================================================
# BLTOUCH
# =========================================================

### Claude


[bltouch]
sensor_pin: ^P0.10
control_pin: P2.0
x_offset: -44
y_offset: -9
z_offset: 0                  # Se sobreescribirá con SAVE_CONFIG tras PROBE_CALIBRATE
speed: 2.0
lift_speed: 5.0
samples: 3
samples_tolerance: 0.050
samples_tolerance_retries: 10
sample_retract_dist: 8.0     # CAMBIADO: de 8.0 a 5.0 — 8mm es excesivo y lento
stow_on_each_sample: True
pin_up_touch_mode_reports_triggered: False
pin_up_reports_not_triggered: True


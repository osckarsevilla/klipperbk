# =========================================================
# NOTAS IMPORTANTES - DIRECT DRIVE vs BOWDEN
# =========================================================
# 1. Retracción en slicer: 0.5-1mm (antes 5-7mm en Bowden)
# 2. Pressure Advance: calibrar con Ellis3dp (rango 0.0-0.4)
# 3. Velocidad de retracción: 25-45mm/s
# 4. PID calibrar: PID_CALIBRATE HEATER=extruder TARGET=200
#                  PID_CALIBRATE HEATER=heater_bed TARGET=60
# 5. Z offset: PROBE_CALIBRATE tras montar el directo
# =========================================================
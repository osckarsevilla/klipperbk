[tmc2209 stepper_y]
uart_pin: P1.9
run_current: 0.700
# stealthchop_threshold: 999999

[tmc2209 stepper_z]
uart_pin: P1.8
run_current: 0.650
hold_current: 0.400
stealthchop_threshold: 999999   # Ya lo tenías ✅

[tmc2209 stepper_z1]

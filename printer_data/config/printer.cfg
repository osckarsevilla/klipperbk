





##### Includes


[pause_resume]

[display_status]


[include timelapse.cfg]

[respond]


[include autotune_tmc.cfg]
[include macros/*.cfg]
[exclude_object]
[include KAMP_Settings.cfg]

# =========================================================
# Ender 3 | SKR V1.4 Turbo | TMC2208 UART | BMG Direct Drive | BLTouch | Klipper
# =========================================================

[virtual_sdcard]
path: /home/oscar/printer_data/gcodes
on_error_gcode: CANCEL_PRINT


[mcu]
serial: /dev/serial/by-id/usb-Klipper_lpc1769_0220001125813AAFFCCC6B5CC12000F5-if00
# Para encontrar tu ID: ls /dev/serial/by-id/

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 2000
max_z_velocity: 10
max_z_accel: 100
square_corner_velocity: 5.0

[input_shaper]
shaper_freq_x: 38.0     # valor típico Ender 3 eje X
shaper_freq_y: 32.0     # valor típico Ender 3 eje Y con cama
shaper_type: mzv        # MZV es el más equilibrado para esta máquina




# =========================================================
# STEPPERS
# =========================================================

[stepper_x]
step_pin: P2.2
dir_pin: !P2.6
enable_pin: !P2.1
microsteps: 16
rotation_distance: 40
endstop_pin: !P1.29
position_endstop: 0
position_min: 0
position_max: 207
homing_speed: 50


#### Gemini



[stepper_y]
step_pin: P0.19
dir_pin: !P0.20              # Sin ! — home va hacia Y positivo (atrás)
enable_pin: !P2.8
microsteps: 16
rotation_distance: 40
endstop_pin: ^!P1.28        # ^ pull-up interno imprescindible
position_endstop: 0
position_min: 0
position_max: 220
homing_speed: 50
homing_retract_dist: 5
homing_positive_dir: false





[stepper_z]
step_pin: P0.22
dir_pin: P2.11
enable_pin: !P0.21
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -6
position_max: 250
homing_speed: 5
second_homing_speed: 2
homing_retract_dist: 5
homing_retract_speed: 10






[stepper_z1]
step_pin: P1.15
dir_pin: P1.14
enable_pin: !P1.16
microsteps: 16
rotation_distance: 8


[z_tilt]
z_positions:
    -35, 117
    270, 117
points:
    60, 117
    170, 117
speed: 100
horizontal_move_z: 10
retries: 10
retry_tolerance: 0.05





[firmware_retraction]
retract_length: 0.8
retract_speed: 35
unretract_extra_length: 0
unretract_speed: 35
# =========================================================
# EXTRUSOR - BMG Direct Drive
# =========================================================

# Extrusion directa
[extruder]
step_pin: P2.13
dir_pin: !P0.11
enable_pin: !P2.12
microsteps: 16

rotation_distance: 22.0
nozzle_diameter: 0.400
filament_diameter: 1.750
pressure_advance: 0.05
heater_pin: P2.7
sensor_type: EPCOS 100K B57560G104F
sensor_pin: P0.24
min_temp: 0
max_temp: 280
min_extrude_temp: 150
max_extrude_only_distance: 200
max_extrude_cross_section: 5

#control = pid
#pid_kp = 29.581
#pid_ki = 2.348
#pid_kd = 93.179



[verify_heater extruder]
max_error: 150      # por defecto 120, puedes subir a 150-200
check_gain_time: 40  # segundos para alcanzar temperatura (default: 20)
hysteresis: 5
heating_gain: 2

# =========================================================
# CAMA
# =========================================================

[heater_bed]
heater_pin: P2.5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: P0.25
min_temp: 0
max_temp: 130
# PID a calibrar: PID_CALIBRATE HEATER=heater_bed TARGET=60
control: pid
pid_kp: 54.027
pid_ki: 0.770
pid_kd: 948.182

# =========================================================
# VENTILADORES
# =========================================================

[fan]           # Ventilador de capa (PWM)
pin: P2.3

[heater_fan hotend_fan]
pin: P2.4
heater: extruder
heater_temp: 50.0

# =========================================================
# BLTOUCH
# =========================================================
[bltouch]
sensor_pin: ^P0.10      
control_pin: P2.0
x_offset: -44
y_offset: -9
speed: 2.0
lift_speed: 3.0
samples: 3
samples_tolerance: 0.050
samples_tolerance_retries: 10
sample_retract_dist: 5.0
stow_on_each_sample: True
#pin_up_touch_mode_reports_triggered: False
pin_up_reports_not_triggered: False
probe_with_touch_mode: True 




[safe_z_home]
home_xy_position: 161, 126
speed: 100
z_hop: 10
z_hop_speed: 30

# =========================================================
# BED MESH
# =========================================================

[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 60, 30
mesh_max: 176, 200
probe_count: 5, 5
mesh_pps: 2, 2
algorithm: bicubic
fade_start: 1
fade_end: 10

# =========================================================
# SCREW TILT (nivelación manual asistida)
# =========================================================
[screws_tilt_adjust]
screw1: 74, 197
screw1_name: delantero izquierdo
screw2: 184, 197
screw2_name: delantero derecho
screw3: 184, 42
screw3_name: trasero derecho
screw4: 74, 42
screw4_name: trasero izquierdo
horizontal_move_z: 10
speed: 150
screw_thread: CCW-M4






#####################################################################
# TMC2209 UART
#####################################################################

[tmc2209 stepper_x]
uart_pin: P1.10
run_current: 0.800
# stealthchop_threshold: 999999

[tmc2209 stepper_y]
uart_pin: P1.9
run_current: 0.700
# stealthchop_threshold: 999999

[tmc2209 stepper_z]
uart_pin: P1.8
run_current: 0.700
hold_current: 0.400
stealthchop_threshold: 999999   # Ya lo tenías ✅

[tmc2209 stepper_z1]
uart_pin: P1.1
run_current: 0.600              # CAMBIADO: de 0.700 a 0.650 — igualar con stepper_z para z_tilt consistente
stealthchop_threshold: 999999   # Ya lo tenías ✅
hold_current: 0.400      



[tmc2209 extruder]
uart_pin: P1.4
run_current: 0.800
# stealthchop_threshold: 999999





[autotune_tmc stepper_x]
motor: ldo-42sth48-2504ah
voltage: 24

[autotune_tmc stepper_y]
motor: ldo-42sth48-2504ah
voltage: 24

[autotune_tmc stepper_z]
motor: ldo-42sth48-2504ah
voltage: 24

[autotune_tmc stepper_z1]
motor: ldo-42sth48-2504ah
voltage: 24


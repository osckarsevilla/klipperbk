[bot]
server: 127.0.0.1
# server: 192.168.3.118
port: 7125
bot_token:8855920819:AAEZmd6NtfQOY0sVYiYiomgGP1ovtByY86w
chat_id:1736181
power_device: printer
[camera]
host: http://192.168.3.248:8080/video
type: mjpeg
host_snapshot: http://192.168.3.248:8080/shot.jpg
fps: 30
video_duration: 5
[progress_notification]
percent: 10
height: 5
time: 600

[timelapse]
cleanup: true
height: 0.2
time: 60
target_fps: 15
min_lapse_duration: 10
max_lapse_duration: 60


[status_message_content]
content: progress, height, filament_length, filament_weight, print_duration, eta, finish_time, m117_status, tgnotify_status, last_update_time, z_height, lapse_status

[print_start_notification]
before_print_sending: true

[print_complete_notification]
after_print_sending: true

[print_cancel_notification]
on_cancel_sending: true

[print_error_notification]
on_error_sending: true

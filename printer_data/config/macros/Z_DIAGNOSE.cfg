[gcode_macro Z_DIAGNOSE]
description: Mide desalineación de husillos Z antes del home
gcode:
    {% set move_speed = 300 %}

    RESPOND MSG="=== DIAGNÓSTICO DOBLE Z ==="

    # Guardar posición actual si ya está homed
    {% if printer.toolhead.homed_axes == "xyz" %}
        {% set z_pos = printer.toolhead.position.z %}
        RESPOND MSG="Posición Z actual: {z_pos:.3f} mm"
    {% else %}
        RESPOND MSG="Ejes no homed — usando FORCE_MOVE para diagnóstico"
    {% endif %}

    # Leer corriente aplicada por z_tilt en último ajuste
    {% if printer.z_tilt is defined %}
        {% set applied = printer.z_tilt.applied %}
        RESPOND MSG="Z_TILT aplicado en último ciclo: {applied}"
        {% if not applied %}
            RESPOND MSG="⚠️  Z_TILT NO se ha ejecutado en esta sesión"
        {% endif %}
    {% endif %}

    RESPOND MSG="=== FIN DIAGNÓSTICO ==="
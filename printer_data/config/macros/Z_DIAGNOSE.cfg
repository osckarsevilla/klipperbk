[gcode_macro Z_DIAGNOSE]
description: Mide desalineación de husillos Z antes del home
gcode:
    RESPOND MSG="=== DIAGNÓSTICO DOBLE Z ==="

    {% if "xyz" in printer.toolhead.homed_axes %}
        {% set z_pos = printer.toolhead.position.z %}
        RESPOND MSG="Posicion Z actual: {z_pos} mm"
    {% else %}
        RESPOND MSG="Ejes no homed"
    {% endif %}

    {% if printer.z_tilt is defined %}
        {% set applied = printer.z_tilt.applied %}
        {% if applied %}
            RESPOND MSG="Z_TILT aplicado correctamente en esta sesion"
        {% else %}
            RESPOND MSG="AVISO: Z_TILT NO ejecutado en esta sesion"
        {% endif %}
    {% endif %}

    RESPOND MSG="=== FIN DIAGNOSTICO ==="
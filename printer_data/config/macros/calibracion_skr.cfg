# =========================================================
# MACROS - Calibración (Impresora 2 - SKR V1.4 Turbo con Z_TILT)
# =========================================================

[gcode_macro CALIBRA_TODO]
description = [Calibración] Calienta, home, z_tilt y screws_tilt
gcode =
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
    RESPOND TYPE=echo MSG="Calentando cama a {BED_TEMP}°C y extrusor a {EXTRUDER_TEMP}°C"
    M140 S{BED_TEMP}
    M104 S{EXTRUSOR_TEMP}
    M190 S{BED_TEMP}
    M109 S{EXTRUSOR_TEMP}
    RESPOND TYPE=echo MSG="✓ Calentado - Iniciando Home"
    G28
    RESPOND TYPE=echo MSG="✓ Home OK - Iniciando Z_TILT_ADJUST"
    Z_TILT_ADJUST
    RESPOND TYPE=echo MSG="✓ Husillos nivelados - Re-home Z"
    G28 Z
    RESPOND TYPE=command MSG="→ Listo para ajustar tornillos"
    SCREWS_TILT_CALCULATE
    RESPOND TYPE=echo MSG="✓ Calibración completada"


[gcode_macro CALIBRAR_MALLA]
description = [Calibración] Home, Z tilt y malla de cama
gcode =
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    M190 S{BED_TEMP}
    G28
    Z_TILT_ADJUST
    BED_MESH_CALIBRATE
    SAVE_CONFIG


[gcode_macro CALIBRAR_Z]
description = [Calibración] Nivelar husillos Z
gcode =
    G28
    Z_TILT_ADJUST
    G28 Z


[gcode_macro ALINEAR_DUAL_Z]
description = [Calibración] Realiza home y calibra el Z-Tilt
gcode =
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    M140 S{BED_TEMP}
    M190 S{BED_TEMP}

    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

    Z_TILT_ADJUST
    G28 Z


[gcode_macro TORNILLOS]
description = [Cama] Lista tornillos y coordenadas
gcode =
    {action_respond_info("=== Tornillos de la cama ===")}
    {action_respond_info("Coordenadas de la boquilla (X, Y)")}
    {action_respond_info("")}
    {action_respond_info("1 - delantero izquierdo  →  X74  Y197")}
    {action_respond_info("2 - delantero derecho    →  X184 Y197")}
    {action_respond_info("3 - trasero derecho      →  X184 Y42")}
    {action_respond_info("4 - trasero izquierdo    →  X74  Y42")}
    {action_respond_info("")}
    {action_respond_info("Ir a un tornillo:  IR_TORNILLO T=1  (1 a 4)")}
    {action_respond_info("0 - centro de la cama    →  X117 Y117")}


[gcode_macro IR_TORNILLO]
description = [Cama] Mover a tornillo. Uso: IR_TORNILLO T=1 (1-4)
gcode =
    {% set t = params.T|default(0)|int %}
    {% set tornillos = {
        0: {'x': 117, 'y': 117, 'nombre': 'Centro de la cama'},
        1: {'x': 74,  'y': 197, 'nombre': 'Delantero izquierdo'},
        2: {'x': 184, 'y': 197, 'nombre': 'Delantero derecho'},
        3: {'x': 184, 'y': 42,  'nombre': 'Trasero derecho'},
        4: {'x': 74,  'y': 42,  'nombre': 'Trasero izquierdo'}
    } %}
    {% if not printer.toolhead.homed_axes == "xyz" %}
        G28
    {% endif %}
    G1 Z10 F3000
    G1 X{tornillos[t].x} Y{tornillos[t].y} F6000
    M117 {tornillos[t].nombre}

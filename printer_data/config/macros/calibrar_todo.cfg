[gcode_macro CALIBRA_TODO]
description: Calienta, calibra z y despues nivelar cama (UP/DOWN)
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
    RESPOND TYPE=echo MSG="Calentando cama a {BED_TEMP}°C y extrusor a {EXTRUDER_TEMP}°C"
    M140 S{BED_TEMP}
    M104 S{EXTRUDER_TEMP}
    M190 S{BED_TEMP}
    M109 S{EXTRUDER_TEMP}
    RESPOND TYPE=echo MSG="✓ Ya está calentita la cosa, empezamos con el Home"
    G28
    RESPOND TYPE=echo MSG="✓ Home OK - Iniciando Z_TILT_ADJUST"
    Z_TILT_ADJUST
    RESPOND TYPE=echo MSG="✓ Husillos nivelados - Re-home Z por si acaso"
    G28 Z
    RESPOND TYPE=command MSG="→ Listo para ajustar tornillos - Gira segun indica la interfaz"
    SCREWS_TILT_CALCULATE
    RESPOND TYPE=echo MSG="✓ Calibración completada. ¡Eres un fenómeno!"

[gcode_macro CALIBRAR_MALLA]
description: Home, Z tilt y malla de cama
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    M190 S{BED_TEMP}
    G28
    Z_TILT_ADJUST
    BED_MESH_CALIBRATE
    SAVE_CONFIG

[gcode_macro CALIBRAR_Z]
description: Nivelar husillos Z
gcode:
    G28
    Z_TILT_ADJUST
    G28 Z



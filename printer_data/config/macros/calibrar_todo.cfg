[gcode_macro CALIBRAR_TODO]
description: [Calibración] Todo en uno - home, Z tilt, malla (cama caliente)
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(0)|float %}

    {action_respond_info("=== CALIBRAR_TODO: inicio ===")}
    {action_respond_info("Cama a {bed}C para compensar dilatación".format(bed=BED_TEMP))}

    M140 S{BED_TEMP}
    M104 S150
    G28
    M190 S{BED_TEMP}

    {action_respond_info("Nivelando motores Z (husillos)...")}
    Z_TILT_ADJUST

    {action_respond_info("Generando malla de cama...")}
    BED_MESH_CALIBRATE

    {% if EXTRUDER_TEMP > 0 %}
        M109 S{EXTRUDER_TEMP}
    {% endif %}

    {action_respond_info("=== CALIBRAR_TODO: terminado ===")}
    {action_respond_info("Ejecuta SAVE_CONFIG para guardar malla y ajustes")}
    {action_respond_info("Si cambiaste el extrusor: PROBE_CALIBRATE y vuelve a SAVE_CONFIG")}
    {action_respond_info("Muelles de cama: CALIBRAR_CAMA o SCREWS_TILT_CALCULATE")}
    M117 Calibracion OK - SAVE_CONFIG


[gcode_macro CALIBRAR_COMPLETO]
description: Calienta, nivela tornillos y hace malla de cama
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
    M140 S{BED_TEMP}
    M104 S{EXTRUDER_TEMP}
    M190 S{BED_TEMP}
    M109 S{EXTRUDER_TEMP}
    G28
    Z_TILT_ADJUST
    SCREWS_TILT_CALCULATE
    M117 Ajusta los tornillos y ejecuta CALIBRAR_CONTINUAR
    PAUSE

[gcode_macro CALIBRAR_CONTINUAR]
description: Continua calibracion despues de ajustar tornillos
gcode:
    G28
    BED_MESH_CALIBRATE
    SAVE_CONFIG
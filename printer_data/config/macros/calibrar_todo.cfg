[gcode_macro CALIBRAR_TORNILLOS]
description: Calienta y nivela tornillos manualmente
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
    M140 S{BED_TEMP}
    M104 S{EXTRUDER_TEMP}
    M190 S{BED_TEMP}
    M109 S{EXTRUDER_TEMP}
    G28
    Z_TILT_ADJUST
    SCREWS_TILT_CALCULATE
    M117 Ajusta tornillos y ejecuta CALIBRAR_MALLA

[gcode_macro CALIBRAR_MALLA]
description: Home, Z tilt y malla de cama
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    M190 S{BED_TEMP}
    G28
    Z_TILT_ADJUST
    BED_MESH_CALIBRATE
    SAVE_CONFIG

[gcode_macro CALIBRAR_Z]
description: Nivelar husillos Z
gcode:
    G28
    Z_TILT_ADJUST
    G28 Z
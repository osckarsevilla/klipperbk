[gcode_macro ATASCADO]
description: Desatasco - calienta, retracción larga y apaga motores (TEMP=230)
gcode:
    {% set temp = params.TEMP|default(230)|float %}
    {% set retract = params.RETRACT|default(80)|float %}

    {action_respond_info("=== ATASCADO: extrayendo filamento ===")}
    {action_respond_info("Calentando a {temp}C...".format(temp=temp))}

    M109 S{temp}
    G91
    G1 E15 F300
    G1 E-{retract} F1200
    G90
    M104 S0
    M84

    {action_respond_info("Retracción de {retract}mm hecha. Motores apagados.".format(retract=retract))}
    {action_respond_info("Corta el filamento, limpia y carga de nuevo con LOAD_FILAMENT")}
    M117 Atasco - filamento fuera

[gcode_macro CAMA_FRIO]
description: Apaga calentadores, ventila y aparca cabezal tras imprimir
gcode:
    {% set fan_speed = params.FAN|default(255)|int %}

    {action_respond_info("Enfriando: cama y hotend OFF, ventilador al {pct}%".format(
        pct=(fan_speed * 100 / 255)|int))}

    M140 S0
    M104 S0
    M106 S{fan_speed}
    G90
    G1 X0 Y220 F3000
    M117 Enfriando...

    {action_respond_info("Cuando la cama esté fría: M107 para apagar el ventilador")}
    {action_respond_info("O ejecuta VENTILADOR_OFF")}

[gcode_macro VENTILADOR_OFF]
description: Apaga el ventilador de capa (tras CAMA_FRIO)
gcode:
    M107
    {action_respond_info("Ventilador de capa apagado")}
    M117 Ventilador OFF

[gcode_macro BLTOUCH_TEST]
description: Prueba despliegue y retracción del BLTouch (CICLOS=3)
gcode:
    {% set cycles = params.CICLOS|default(3)|int %}

    {action_respond_info("=== BLTOUCH_TEST: {cycles} ciclos ===".format(cycles=cycles))}

    {% for i in range(cycles) %}
        {action_respond_info("Ciclo {n}/{total}: desplegando...".format(n=i+1, total=cycles))}
        BLTOUCH_DEBUG COMMAND=pin_down
        G4 P1000
        QUERY_PROBE

        {action_respond_info("Ciclo {n}/{total}: retrayendo...".format(n=i+1, total=cycles))}
        BLTOUCH_DEBUG COMMAND=pin_up
        G4 P1000
        QUERY_PROBE
    {% endfor %}

    {action_respond_info("=== BLTOUCH_TEST: terminado ===")}
    {action_respond_info("triggered=1 al desplegar y triggered=0 retraído = OK")}
    M117 BLTouch OK

[gcode_macro CALIBRAR_CAMA]
description: [Calibración] Cama caliente + SCREWS_TILT (muelles de la cama)
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(210)|float %}
    M140 S{BED_TEMP}
    M104 S{EXTRUDER_TEMP}
    M190 S{BED_TEMP}        # Espera a que llegue a temperatura
    M109 S{EXTRUDER_TEMP}
    G28                      # Home
    SCREWS_TILT_CALCULATE    # Mide y calcula cuánto girar cada tornillo










[gcode_macro CALIBRAR_Z]
description: [Calibración] Nivelar husillos Z (doble motor)
gcode:
    G28
    Z_TILT_ADJUST
    G28 Z
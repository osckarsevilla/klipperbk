[gcode_macro CALIBRAR_CAMA]
description: Calienta la cama y calcula el ajuste de tornillos
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    M140 S{BED_TEMP}
    M190 S{BED_TEMP}        # Espera a que llegue a temperatura
    G28                      # Home
    SCREWS_TILT_CALCULATE    # Mide y calcula cuánto girar cada tornillo










[gcode_macro CALIBRAR_Z]
description: Nivela los dos motores Z
gcode:
    G28
    Z_TILT_ADJUST
    G28 Z
[gcode_macro ALINEAR_DUAL_Z]
description: Realiza el home de los ejes y calibra el Z-Tilt
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}

    M140 S{BED_TEMP}    ; Envía la orden de calentar la cama a BED_TEMP grados (no bloquea, continúa)
    M190 S{BED_TEMP}    ; Espera hasta que la cama alcance BED_TEMP antes de continuar

    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28             ; Home completo solo si los ejes no tienen referencia aún
    {% endif %}

    Z_TILT_ADJUST       ; Ajusta los dos motores Z para nivelar el eje X (gantry)

    G28 Z               ; Re-home solo el eje Z porque Z_TILT_ADJUST desplaza ligeramente el Z0
[gcode_macro LOAD_FILAMENT]
description: [Filamento] Cargar filamento
gcode:
    M109 S200
    G91
    G1 E50 F300
    G1 E30 F150
    G90

[gcode_macro UNLOAD_FILAMENT]
description: [Filamento] Descargar filamento
gcode:
    M109 S200
    G91
    G1 E5 F300
    G1 E-60 F800
    G90

[gcode_macro CARGAR_FILAMENTO]
description: Calienta y carga filamento
gcode:
    {% set TEMP = params.TEMP|default(200)|float %}
    M109 S{TEMP}
    M83
    G1 E200 F300
    M117 Filamento cargado

[gcode_macro START_PRINT]
description: [Impresión] Inicio de impresión - home, Z tilt, malla KAMP, purga
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
    M140 S{BED_TEMP}
    M104 S150
    G28
    Z_TILT_ADJUST
    BED_MESH_CALIBRATE        # Adaptativo con KAMP
    M190 S{BED_TEMP}
    M109 S{EXTRUDER_TEMP}
    LINE_PURGE                # Purga adaptativa junto a la pieza

[gcode_macro END_PRINT]
description: [Impresión] Fin de impresión - retracción, aparcar, apagar calentadores
gcode:
    G91
    G1 E-2 F2700                       # Retracción directo: 2mm
    G1 Z10 E-2 F3000
    G90
    G1 X0 Y220 F3000
    M104 S0
    M140 S0
    M84



[gcode_macro CANCEL_PRINT]
description: [Impresión] Cancelar impresión en curso
rename_existing: CANCEL_PRINT_BASE
gcode:
    TURN_OFF_HEATERS
    CANCEL_PRINT_BASE
    G91
    G1 Z10 F3000
    G90
    G1 X0 Y220 F3000
    M84

[gcode_macro PAUSE]
description: [Impresión] Pausar impresión
rename_existing: PAUSE_BASE
gcode:
    PAUSE_BASE
    G91
    G1 E-2 F2700
    G1 Z10 F3000
    G90
    G1 X0 Y220 F3000

[gcode_macro RESUME]
description: [Impresión] Reanudar impresión
rename_existing: RESUME_BASE
gcode:
    G91
    G1 E2 F2700
    G90
    RESUME_BASE
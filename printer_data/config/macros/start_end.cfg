[gcode_macro START_PRINT]
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
    M140 S{BED_TEMP}                  # Precalentar cama
    M104 S150                          # Precalentar hotend parcial (evita oozing)
    G28                                # Home
    BED_MESH_CALIBRATE                 # Malla de cama
    M190 S{BED_TEMP}                  # Esperar cama
    M109 S{EXTRUDER_TEMP}             # Esperar hotend
    G92 E0
    G1 Z2.0 F3000
    G1 X0.1 Y20 Z0.3 F5000
    G1 X0.1 Y200 Z0.3 F1500 E15      # Línea de purga
    G1 X0.4 Y200 Z0.3 F5000
    G1 X0.4 Y20 Z0.3 F1500 E30
    G92 E0

[gcode_macro END_PRINT]
gcode:
    G91
    G1 E-2 F2700                       # Retracción directo: 2mm
    G1 Z10 E-2 F3000
    G90
    G1 X0 Y220 F3000
    M104 S0
    M140 S0
    M84



[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
    TURN_OFF_HEATERS
    CANCEL_PRINT_BASE
    G91
    G1 Z10 F3000
    G90
    G1 X0 Y220 F3000
    M84

[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: PAUSE_BASE
gcode:
    PAUSE_BASE
    G91
    G1 E-2 F2700
    G1 Z10 F3000
    G90
    G1 X0 Y220 F3000

[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE
gcode:
    G91
    G1 E2 F2700
    G90
    RESUME_BASE
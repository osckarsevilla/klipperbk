# [gcode_macro START_PRINT]
# description: [Impresión] Inicio de impresión - home, Z tilt, malla KAMP, purga
# gcode:
#     TIMELAPSE_TAKE_FRAME
#     {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
#     {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
#     M140 S{BED_TEMP}
#     M104 S150
#     G28
#     Z_TILT_ADJUST
#     BED_MESH_CALIBRATE
#     M190 S{BED_TEMP}
#     M109 S{EXTRUDER_TEMP}
#     LINE_PURGE




[gcode_macro START_PRINT]
description: [Impresión] Inicio de impresión - home, Z tilt, malla KAMP, purga
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
    {% set EXTRUDER_PREHEAT = (EXTRUDER_TEMP * 0.75)|int %}  # ~150°C en PLA, ~180°C en PETG

    # 1. Calentamiento inicial sin bloquear — extrusor a temperatura antiooze
    M140 S{BED_TEMP}                  # Cama: empieza a calentar (no bloquea)
    M104 S{EXTRUDER_PREHEAT}          # Extrusor: preheat antiooze (no bloquea)

    # 2. Homing y nivelación mecánica
    G28
    Z_TILT_ADJUST

    # 3. Esperar temperatura de cama ANTES del mesh (crítico para precisión)
    M190 S{BED_TEMP}

    # 4. Mesh adaptativo KAMP — con cama a temperatura y objetos ya definidos
    BED_MESH_CALIBRATE

    # 5. Extrusor a temperatura final de impresión
    M109 S{EXTRUDER_TEMP}

    # 6. Purga y primer frame de timelapse con posición conocida
    LINE_PURGE
    TIMELAPSE_TAKE_FRAME  

[gcode_macro END_PRINT]
description: [Impresión] Fin de impresión - retracción, subir Z y presentar pieza delante
gcode:
    G91
    G1 E-2 F2700
    G1 Z15 F3000
    G90
    CAMA_FRIO FAN={params.FAN|default(255)}
    G1 X5 Y{printer.toolhead.axis_maximum.y - 5} F3000
    M84
    TIMELAPSE_RENDER



[gcode_macro CANCEL_PRINT]
description: [Impresión] Cancelar impresión en curso
rename_existing: CANCEL_PRINT_BASE
gcode:
    TURN_OFF_HEATERS
    CANCEL_PRINT_BASE
    G91
    G1 Z15 F3000
    G90
    G1 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_minimum.y + 5} F3000
    M84

[gcode_macro PAUSE]
description: [Impresión] Pausar impresión
rename_existing: PAUSE_BASE
gcode:
    PAUSE_BASE
    G91
    G1 E-2 F2700
    G1 Z15 F3000
    G90
    G1 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_minimum.y + 5} F3000

[gcode_macro RESUME]
description: [Impresión] Reanudar impresión
rename_existing: RESUME_BASE
gcode:
    G91
    G1 E2 F2700
    G90
    RESUME_BASE
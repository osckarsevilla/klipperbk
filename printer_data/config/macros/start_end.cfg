# [gcode_macro START_PRINT]
# description: [Impresión] Inicio de impresión - home, Z tilt, malla KAMP, purga
# gcode:
#     TIMELAPSE_TAKE_FRAME
#     {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
#     {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
#     M140 S{BED_TEMP}
#     M104 S150
#     G28
#     Z_TILT_ADJUST
#     BED_MESH_CALIBRATE
#     M190 S{BED_TEMP}
#     M109 S{EXTRUDER_TEMP}
#     LINE_PURGE



[gcode_macro START_PRINT]
description = Inicio de impresión
gcode =
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
    {% set EXTRUDER_PREHEAT = (EXTRUDER_TEMP * 0.75)|int %}

    M140 S{BED_TEMP}
    M104 S{EXTRUDER_PREHEAT}
    G28
    Z_TILT_ADJUST
    M190 S{BED_TEMP}
    BED_MESH_CALIBRATE
    M109 S{EXTRUDER_TEMP}
    LINE_PURGE
    TIMELAPSE_TAKE_FRAME
[gcode_macro END_PRINT]
description: [Impresión] Fin de impresión - retracción, subir Z y presentar pieza delante
gcode:
    G91
    G1 E-2 F2700
    G1 Z15 F3000
    G90
    CAMA_FRIO FAN={params.FAN|default(255)}
    G1 X5 Y{printer.toolhead.axis_maximum.y - 5} F3000
    M84
    TIMELAPSE_RENDER



[gcode_macro CANCEL_PRINT]
description = [Impresión] Cancelar impresión en curso
rename_existing = CANCEL_PRINT_BASE
gcode =
    TURN_OFF_HEATERS
    CANCEL_PRINT_BASE
    G91
    G1 Z15 F3000
    G90
    G1 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_minimum.y + 5} F3000
    M84

[gcode_macro PAUSE]
description = [Impresión] Pausar impresión con retracción y aparcamiento seguro
rename_existing = PAUSE_BASE
gcode =
    # 1. Guardar la posición actual de la impresión
    SAVE_GCODE_STATE NAME=PAUSE_state
    
    # 2. Ejecutar la pausa nativa de Klipper
    PAUSE_BASE
    
    # 3. Definir distancias seguras de retirada
    {% set z_wait = 15.0 %}                       ; Cuánto va a subir el eje Z al pausar (seguridad piezas altas)
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    
    {% if act_z < (max_z - z_wait) %}
        {% set z_safe = z_wait %}
    {% else %}
        {% set z_safe = max_z - act_z %}
    {% endif %}
    
    # 4. Retirar filamento para evitar goteos
    G91
    G1 E-2 F2700
    
    # 5. Mover el cabezal arriba y traer la CAMA HACIA ADELANTE
    G1 Z{z_safe} F900                             ; Sube el eje Z para no chocar con la pieza (15mm para piezas altas)
    G90                                           ; Volver a coordenadas absolutas
    G1 X{printer.toolhead.axis_maximum.x - 10} Y{printer.toolhead.axis_maximum.y - 5} F3000  ; Derecha-adelante para mejor acceso
    # 4. Retirar filamento para evitar goteos
    G91
    G1 E-2 F2700
    
    # 5. Mover el cabezal arriba y traer la CAMA HACIA ADELANTE
    G1 Z{z_safe} F900                             ; Sube el eje Z para no chocar con la pieza (15mm para piezas altas)
    G90                                           ; Volver a coordenadas absolutas
    G1 X{printer.toolhead.axis_maximum.x - 10} Y{printer.toolhead.axis_maximum.y - 5} F3000  ; Derecha-adelante para mejor acceso

[gcode_macro RESUME]
description = [Impresión] Reanudar impresión
rename_existing = RESUME_BASE
gcode =
    G91
    G1 E2 F2700
    G90
    RESTORE_GCODE_STATE NAME=PAUSE_state
    RESUME_BASE
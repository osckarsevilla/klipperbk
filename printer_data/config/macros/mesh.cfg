[gcode_macro MESH_SAVED]
description: Carga la malla guardada sin volver a sondear (PROFILE=default)
gcode:
    {% set profile = params.PROFILE|default("default") %}

    {action_respond_info("Cargando malla '{profile}'...".format(profile=profile))}
    G28
    BED_MESH_PROFILE LOAD={profile}
    {action_respond_info("Malla '{profile}' activa".format(profile=profile))}
    M117 Malla {profile} cargada

[gcode_macro MESH_GUARDAR]
description: Guarda la malla actual en un perfil (PROFILE=default)
gcode:
    {% set profile = params.PROFILE|default("default") %}

    {% if printer.toolhead.homed_axes != "xyz" %}
        {action_raise_error("Haz G28 antes de guardar la malla")}
    {% endif %}

    BED_MESH_PROFILE SAVE={profile}
    SAVE_CONFIG
    {action_respond_info("Malla guardada como '{profile}'".format(profile=profile))}
    M117 Malla {profile} guardada

[gcode_macro MESH_BORRAR]
description: Borra un perfil de malla guardado (PROFILE=nombre)
gcode:
    {% set profile = params.PROFILE|default("default") %}
    BED_MESH_PROFILE REMOVE={profile}
    SAVE_CONFIG
    {action_respond_info("Perfil '{profile}' eliminado".format(profile=profile))}

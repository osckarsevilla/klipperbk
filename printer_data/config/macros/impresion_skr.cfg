# =========================================================
# MACROS - Inicio/Fin Impresión (Impresora 2 - SKR V1.4 Turbo)
# =========================================================

[gcode_macro START_PRINT]
description = [Impresión] Inicio de impresión
gcode =
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
    {% set EXTRUDER_PREHEAT = (EXTRUDER_TEMP * 0.75)|int %}

    M140 S{BED_TEMP}
    M104 S{EXTRUDER_PREHEAT}
    G28
    ; Nivelar cama si la impresora tiene doble motor Z (Máquina 2)
    {% if 'z_tilt' in printer %}
        Z_TILT_ADJUST
    {% endif %}
    M190 S{BED_TEMP}
    BED_MESH_CALIBRATE
    M109 S{EXTRUDER_TEMP}
    LINE_PURGE
    TIMELAPSE_TAKE_FRAME


[gcode_macro END_PRINT]
description = [Impresión] Fin de impresión
gcode =
    G91
    G1 E-2 F2700
    G1 Z15 F3000
    G90
    CAMA_FRIO FAN={params.FAN|default(255)}
    G1 X5 Y{printer.toolhead.axis_maximum.y - 5} F3000
    M84
    TIMELAPSE_RENDER

# Tornillos de nivelación de la cama (coordenadas de la boquilla)
# Deben coincidir con [screws_tilt_adjust] en printer.cfg

[gcode_macro TORNILLOS]
description: [Cama] Lista tornillos y coordenadas de la cama
gcode:
    {action_respond_info("=== Tornillos de la cama ===")}
    {action_respond_info("Coordenadas de la boquilla (X, Y)")}
    {action_respond_info("")}
    {action_respond_info("1 - delantero izquierdo  →  X74  Y42")}
    {action_respond_info("2 - delantero derecho    →  X235 Y42")}
    {action_respond_info("3 - trasero derecho      →  X235 Y212")}
    {action_respond_info("4 - trasero izquierdo    →  X74  Y212")}
    {action_respond_info("")}
    {action_respond_info("Ir a un tornillo:  IR_TORNILLO NUM=1  (1 a 4)")}
    {action_respond_info("Calibrar muelles:  CALIBRAR_CAMA  o  SCREWS_TILT_CALCULATE")}

[gcode_macro IR_TORNILLO]
description: [Cama] Ir a tornillo NUM=1..4 (delantero izq … trasero izq)
gcode:
    {% set num = params.NUM|default(1)|int %}
    {% set z_safe = params.Z|default(10)|float %}
    {% set speed = params.SPEED|default(50)|float * 60 %}

    {% if num == 1 %}
        {% set x = 74 %}
        {% set y = 42 %}
        {% set nombre = "delantero izquierdo" %}
    {% elif num == 2 %}
        {% set x = 235 %}
        {% set y = 42 %}
        {% set nombre = "delantero derecho" %}
    {% elif num == 3 %}
        {% set x = 235 %}
        {% set y = 212 %}
        {% set nombre = "trasero derecho" %}
    {% elif num == 4 %}
        {% set x = 74 %}
        {% set y = 212 %}
        {% set nombre = "trasero izquierdo" %}
    {% else %}
        {action_raise_error("NUM debe ser 1, 2, 3 o 4")}
    {% endif %}

    {action_respond_info("Yendo al tornillo {num}: {nombre} (X{x} Y{y})".format(
        num=num, nombre=nombre, x=x, y=y))}

    G28
    G0 Z{z_safe} F3000
    G0 X{x} Y{y} F{speed}
    M117 T{num}: {nombre}

[gcode_macro PURGA_MANUAL]
description: Purga fija en esquina delantera (TEMP=200 AMOUNT=30)
gcode:
    {% set temp = params.TEMP|default(200)|float %}
    {% set amount = params.AMOUNT|default(30)|float %}
    {% set z = params.Z|default(0.8)|float %}
    {% set x_start = params.X|default(10)|float %}
    {% set y = params.Y|default(5)|float %}
    {% set line_len = params.LEN|default(40)|float %}

    {action_respond_info("Purga manual: {amount}mm a {temp}C".format(amount=amount, temp=temp))}

    M109 S{temp}
    G28
    G90
    G0 Z{z} F3000
    G0 X{x_start} Y{y} F6000
    G91
    G1 X{line_len} E{amount} F1500
    G90
    G1 E-1 F2700
    G0 Z5 F3000
    {action_respond_info("Purga completada")}
    M117 Purga OK

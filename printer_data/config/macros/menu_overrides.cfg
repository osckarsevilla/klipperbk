# =========================================================
# Sobrescribe el submenu "OctoPrint" de la pantalla para que
# llame a los comandos reales PAUSE/RESUME/CANCEL_PRINT en vez
# de las señales action:pause/resume/cancel (pensadas para un
# servidor OctoPrint real, que no usamos con Moonraker).
# =========================================================

[menu __main __octoprint __pause]
type: command
enable: {printer.print_stats.state == "printing"}
name: Pause printing
gcode:
    PAUSE

[menu __main __octoprint __resume]
type: command
enable: {printer.print_stats.state == "paused"}
name: Resume printing
gcode:
    RESUME

[menu __main __octoprint __abort]
type: command
enable: {printer.print_stats.state == "printing" or printer.print_stats.state == "paused"}
name: Cancel printing
gcode:
    CANCEL_PRINT
